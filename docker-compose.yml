# Local stack: PostGIS plus the single InfraAlert service with the development
# backends (no Google Cloud needed). For day-to-day work `make db-up` + `make dev`
# is faster; `make docker-up` runs the production image locally.

networks:
  infra-network:
    driver: bridge

volumes:
  db-data:
  app-var:

services:

  # System of record (ADR 0003). Host port 5433 avoids clashing with a local Postgres.
  db:
    image: postgis/postgis:16-3.5
    # The official image is amd64-only; Apple Silicon runs it under emulation.
    platform: linux/amd64
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: infraalert
      POSTGRES_PASSWORD: infraalert
      POSTGRES_DB: infraalert
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - infra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infraalert -d infraalert"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The whole service (backend + built frontend) on http://localhost:8000.
  app:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://infraalert:infraalert@db:5432/infraalert
      # Cloudflare's always-pass Turnstile test secret (pairs with the frontend's test site key).
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      RATE_LIMIT_SECRET: dev-only-rate-limit-secret
      TASKS_BACKEND: inline
      STORAGE_BACKEND: local
      LOCAL_UPLOAD_DIR: /app/var/uploads
      PUBLIC_BASE_URL: http://localhost:8000
      EXTRACTOR_BACKEND: disabled
      STAFF_AUTH_BACKEND: dev
      EMAIL_BACKEND: console
      LOCAL_OUTBOX_DIR: /app/var/outbox
    volumes:
      # Uploaded photos and console emails.
      - app-var:/app/var
    networks:
      - infra-network
    # Development convenience: bring the schema up to date on every start.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
