[project]
name = "infra-alert-webapp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15.0",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
    "google-auth>=2.29.0",
    "google-cloud-storage>=2.16.0",
    "google-cloud-tasks>=2.16.0",
    "google-genai>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["infraalert"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
