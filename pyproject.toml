# uv workspace root. The whole application is one package: webapp/backend (ADR 0001).
[tool.uv.workspace]
members = ["webapp/backend"]

# Ruff — linter & formatter
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["infraalert"]

# Mypy — static type checker
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# Pytest (DB tests need TEST_DATABASE_URL; see webapp/backend/tests/conftest.py)
[tool.pytest.ini_options]
testpaths = ["webapp/backend/tests"]
python_files = ["test_*.py"]
