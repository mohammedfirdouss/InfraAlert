[tool.uv.workspace]
members = ["agents/*", "mcp_server", "webapp/backend"]

# Ruff — linter & formatter
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Mypy — static type checker
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# Pytest
[tool.pytest.ini_options]
testpaths = ["agents", "mcp_server", "webapp/backend"]
python_files = ["test_*.py"]
